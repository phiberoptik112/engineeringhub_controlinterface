# Engineering Hub Configuration
# Copy this file to your workspace as config.yaml and fill in values

# ── LLM provider ─────────────────────────────────────────────────
# Choose which backend agents use for text generation:
#   "anthropic" — Claude API (default, requires api_key)
#   "mlx"       — Local Apple Silicon inference via mlx-lm
#   "ollama"    — Local/networked Ollama server (works in Docker containers)
llm_provider: "anthropic"

django:
  # Django consultingmanager API URL
  api_url: "http://localhost:8000/api"

  # API authentication token
  # Get this from Django: python manage.py drf_create_token <username>
  # Or set environment variable: ENGINEERING_HUB_DJANGO_API_TOKEN
  api_token: ""

  # Cache TTL for API responses (seconds)
  cache_ttl: 300

anthropic:
  # Anthropic API key for Claude
  # Get this from: https://console.anthropic.com/
  # Or set environment variable: ENGINEERING_HUB_ANTHROPIC_API_KEY
  api_key: ""

  # Claude model to use
  model: "claude-sonnet-4-5-20250929"

  # Maximum tokens for responses
  max_tokens: 4000

workspace:
  # Base workspace directory
  # Default: ~/org-roam/engineering-hub
  dir: "~/org-roam/engineering-hub"

  # Working directory for input files (PDFs, DOCX, .md).
  # Drop files here and reference them with short relative paths in task wikilinks:
  #   [[inputs/project-25/client-brief.pdf]]
  # Defaults to workspace_dir/inputs if not set.
  # inputs_dir: "~/org-roam/engineering-hub/inputs"

# Journal / task dispatch mode
#
# Three mutually exclusive modes (use_org_mode takes priority):
#
#   use_org_mode: true   — read tasks from org-roam daily journal .org files
#                          (recommended — integrates with your existing workflow)
#   use_journal_mode: true — read tasks from workspace_dir/journal.md
#   (neither)            — legacy shared-notes.md with @agent: STATUS blocks
#
journal:
  # ── Org mode (org-roam daily journal) ─────────────────────────────
  # Watches org_journal_dir for *.org changes.
  # Tasks are written as:  - [ ] @research: description [[django://project/25]]
  # Capture templates are defined in $DOOMDIR/config.el (see docs/workflow.md).
  use_org_mode: true

  # Path to daily .org files (YYYY-MM-DD.org). Journaler uses this path directly
  # (not only org_roam_dir/journal). Example: ~/org-roam/journals
  # Default: ~/org-roam/journal
  # org_journal_dir: "~/org-roam/journals"

  # Org headings whose list items are treated as agent tasks
  org_task_sections:
    - "Overnight Agent Tasks"

  # How many recent daily files to scan for pending tasks
  # 3 = covers a weekend gap (Friday → Monday)
  org_lookback_days: 3

  # How many recent daily files to include when building historical task context
  # for agents (used by context enrichment, not task dispatch)
  org_context_lookback_days: 7

  # ── Markdown journal mode (fallback) ──────────────────────────────
  # Only active when use_org_mode is false.
  use_journal_mode: false

  # Category header -> agent mapping (items under these become tasks)
  categories:
    "Project Work to-do": "research"
    "Technical Writing Work": "technical-writer"
    "Technical Review Work": "technical-reviewer"
    "Thoughts to Expand or Clarify": "research"
  # "Incoming Comms" has no mapping - notes only

# ── Roam graph integration ─────────────────────────────────────────
roam:
  # Create .org wrapper nodes in the roam directory for agent outputs,
  # giving them a presence in the org-roam knowledge graph
  wrappers_enabled: true

# Staging directory for ingested files (PDF/DOCX -> markdown)
staging:
  manifest_name: "manifest.json"

# ── Rental Scout (Bay Area rental search agent) ───────────────────
# Workspace holding the rental-scout pipeline (main.py) and its artifacts:
# criteria.yaml, seen_listings.db, latest_digest.json.
# Exposed to journaler agents via /agent rental-scout and to external MCP
# clients via the rental-scout tools mounted in `engineering-hub mcp-server`.
# rental_scout:
#   workspace_dir: "~/dev/rental_scout"
#   # Python for run_scan subprocesses. Defaults to {workspace_dir}/.venv/bin/python
#   # when that venv exists, otherwise the engineering-hub interpreter.
#   # python_path: "~/dev/rental_scout/.venv/bin/python"

# ── Blender MCP (3D scene control via HTTP addon in Blender) ──────
# Requires a running Blender session with an MCP addon enabled (e.g. dcc-mcp-blender
# at http://127.0.0.1:8765/mcp). Exposed to journaler via /agent blender and optionally
# proxied under the blender_ namespace in `engineering-hub mcp-server`.
# blender:
#   enabled: false
#   mcp_url: "http://127.0.0.1:8765/mcp"
#   # auth_token: set via ENGINEERING_HUB_BLENDER_AUTH_TOKEN instead of YAML
#   connect_timeout_s: 10
#   tools_cache_ttl_s: 60
#   # tool_allowlist: ["get_scene_info", "list_objects"]
#   tool_denylist: ["run_python_script"]

# ── Horn Iterator (parametric exponential-horn sweep, LVT alert system) ──
# Local compute (no API). Exposed via the `engineering-hub horn` CLI, the
# `/horn` slash command in journaler chat, and `/agent horn-iterator`.
# All keys are optional; defaults follow the N4v3 horn blueprint.
# horn_iterator:
#   enabled: true
#   # Where sweep exports (CSV/org) are written; defaults to {workspace_dir}/horn_iterator
#   output_dir: "~/dev/horn_sweeps"
#   # Geometry/physics overrides (blueprint defaults shown):
#   flare_rate_per_m: 17.8      # exponential m (/m); fc = c*m/(4*pi) ~= 486 Hz
#   slot_area_mm2: 1050         # diffraction slot throat area S_T (mm^2)
#   adapter_length_mm: 52       # fixed pre-flare adapter length (mm)

# ── MLX local model (Apple Silicon) ───────────────────────────────
# Used when llm_provider is "mlx". Install with: pip install 'engineering-hub[mlx]'
# Gemma 4 is a Vision-Language Model (VLM) — the engine auto-detects this and
# uses mlx-vlm instead of mlx-lm transparently.
# mlx:
#   # HuggingFace model ID — resolved from the HF cache automatically:
#   model_path: "mlx-community/gemma-4-31b-it-8bit"
#
#   # Or point directly at a local cache snapshot directory:
#   # model_path: "~/.cache/huggingface/hub/models--mlx-community--gemma-4-31b-it-8bit/snapshots/<hash>"
#
#   # Sampling parameters (defaults shown)
#   temp: 0.7
#   top_p: 0.9
#   min_p: 0.05
#   repetition_penalty: 1.1
#   max_tokens: 4096

# ── Ollama (local embeddings + optional chat generation) ─────────
# The same Ollama instance serves both embedding and chat generation.
# Chat generation is used when llm_provider is "ollama" (above).
ollama:
  host: "http://localhost:11434"

  # Pull embedding model once before first use:
  #   ollama pull nomic-embed-text     (274MB, 768-dim, fast)
  #   ollama pull mxbai-embed-large    (670MB, 1024-dim, higher quality)
  embed_model: "nomic-embed-text"

  # Chat generation model (required when llm_provider: "ollama").
  # Pull before first use: ollama pull llama3.1:8b
  # chat_model: "llama3.1:8b"

  # HTTP timeout for chat requests (longer than embedding, seconds)
  # chat_timeout: 120

  # Sampling parameters (defaults shown)
  # temp: 0.7
  # top_p: 0.9

# ── Memory settings ───────────────────────────────────────────────
memory:
  enabled: true
  search_k: 5         # memories injected per agent task
  threshold: 0.35     # cosine similarity floor (0.0-1.0)

# ── Zettelkasten proposal workflow ────────────────────────────────
# Mines marked org-roam daily journal spans into reviewable permanent-note
# proposals. It writes proposal buffers under outputs/zettelkasten first;
# permanent org-roam files are created only by `engineering-hub zettel apply`.
zettelkasten:
  enabled: true
  # proposal_dir: "~/org-roam/engineering-hub/outputs/zettelkasten"
  markers:
    - "#idea"
    - "#extract"
    - "TODO extract"
    - "TODO: extract"
  journal_lookback_days: 7
  link_top_k: 5
  link_similarity_threshold: 0.75

# ── PDF reference corpus (libraryfiles-corpus) ───────────────────
# Install in the same venv: pip install -e /path/to/libraryfiles_corpus
# Uses ollama.host / ollama.embed_model above for query-time embeddings.
#
# corpus:
#   enabled: false
#   db_path: "~/dev/libraryfiles_corpus/corpus.db"
#   search_k: 5
#   threshold: 0.40

# ── Local-first web search for /agent ─────────────────────────────
# Uses a local/self-hosted SearXNG instance to retrieve web snippets, then
# injects bounded results into delegated /agent context. MLX still performs
# the reasoning; SearXNG only supplies current web references.
#
# Example SearXNG query endpoint:
#   http://localhost:8080/search?q=ASTM%20E336&format=json
#
# agent_web_search:
#   enabled: false          # default off; use /agent ... --web per command
#   provider: "searxng"
#   searxng_url: "http://localhost:8080"
#   max_results: 5
#   max_chars: 12000
#   timeout_seconds: 10.0
#   anthropic_backup_enabled: false   # optional Claude fallback if local search fails
#   anthropic_tool_version: "web_search_20250305"
#   anthropic_max_uses: 3

# ── Document ingest chunking ─────────────────────────────────────
# When files are ingested (PDF/DOCX), they are chunked and embedded
# into memory for semantic search. Requires the docling extra:
#   pip install 'engineering-hub[docling]'
# Falls back to pypdf/python-docx when docling is not installed.
chunking:
  enabled: true
  max_tokens: 512     # per chunk, aligned with nomic-embed-text context

# ── Docker container execution ───────────────────────────────────
# Run agent tasks in isolated Docker containers instead of locally.
# MLX tasks always stay on the host (requires Apple Silicon Metal).
# Anthropic and Ollama tasks can be routed to containers.
#
# Quick start:
#   docker compose up -d                                  # start Ollama service
#   docker compose exec ollama ollama pull llama3.1:8b    # pull model
#   engineering-hub docker build                          # build task image
#   engineering-hub start --docker                        # run with containers
#
# docker:
#   enabled: false
#   task_image: "engineering-hub-task:latest"
#   network: "engineering-hub-net"
#   cpu_limit: 2.0          # CPU cores per task container
#   memory_limit: "2g"      # Memory per task container
#   task_timeout: 300        # Seconds before killing a task container
#   max_concurrent: 3        # Max parallel task containers
#   # Ollama URL as seen from inside containers (Docker Compose service name)
#   ollama_host: "http://ollama:11434"

# ── Pi coding agent (code-engineer) ──────────────────────────────
# The code-engineer agent delegates software changes to the external Pi
# coding agent (https://pi.dev) running in an isolated git worktree of a
# registered local repository. Install Pi with:
#   npm install -g --ignore-scripts @earendil-works/pi-coding-agent
#
# pi:
#   bin: "pi"                 # path to the pi CLI (or "node /path/to/pi.js")
#   mode: "json"              # json (structured events) | print
#   task_timeout: 1800        # seconds before killing a Pi run
#   max_concurrent: 1         # parallel Pi runs (repos are stateful; keep low)
#   default_tools: ""         # "" = full toolset; e.g. "read,grep,find,ls" for review-only
#   provider: "anthropic"     # anthropic | openai | google
#   model: "claude-sonnet-4-5"
#   share_hub_api_key: true   # pass hub's anthropic key via --api-key; false = use Pi's own /login creds
#   offline: true             # set PI_OFFLINE=1 + PI_SKIP_VERSION_CHECK=1 for deterministic runs
#
# Local repositories the code-engineer may operate on. The map key is the
# project id used in tasks:  /agent code-engineer <task> --project myrepo
# or an org task:  - [ ] @code-engineer: <task> [[project/myrepo]]
#
# code_projects:
#   myrepo:
#     path: "~/dev/myrepo"
#     default_branch: "main"
#     test_cmd: "npm test"      # optional; surfaced to Pi in the briefing
#     provider: "anthropic"     # optional per-repo override of pi.provider
#     model: "claude-sonnet-4-5"  # optional per-repo override of pi.model
#     tools: ""                 # optional per-repo override of pi.default_tools

# ── Journaler daemon (always-on ambient listener) ────────────────
# The Journaler runs a local ~32B model, continuously monitors your
# org-roam workspace, delivers morning briefings, and responds to
# ad-hoc questions via HTTP chat.  Requires: pip install 'engineering-hub[mlx]'
#
# journaler:
#   enabled: true
#
#   # HuggingFace model ID for the local MLX model.
#   # Optional: if omitted, Journaler falls back to mlx.model_path then to a built-in default.
#   # Pre-download before first use: engineering-hub journaler download
#   #
#   # Recommended options (Apple Silicon):
#   #
#   #   mlx-community/gemma-4-31b-it-8bit  ← default
#   #     Gemma 4 31B instruction-tuned, 8-bit quantized (~34GB on disk, ~34GB RAM).
#   #     VLM architecture — uses mlx-vlm automatically. 128K context window.
#   #     Best overall quality for briefings, chat, and agentic delegation.
#   #     Requires 64GB+ unified RAM for comfortable operation.
#   #
#   #   mlx-community/gemma-4-31b-it-4bit
#   #     Same model at 4-bit (~17GB). Fits in 32GB with reduced fidelity.
#   #
#   #   mlx-community/Qwen3-30B-A3B-Instruct-2507-4bit
#   #     MoE (~3B active params), fastest, lowest RAM (~32GB). Text-only (mlx-lm).
#   #
#   model_path: "mlx-community/gemma-4-31b-it-8bit"
#
#   # Named profiles (optional). When ``models`` is non-empty, ``model_profile``
#   # selects which entry to use. Override on the CLI:
#   #   engineering-hub journaler --profile reasoning chat
#   #   engineering-hub journaler --model mlx-community/other-id start
#   # In chat (CLI or HTTP): /model , /model_browse , /model reasoning , /model path <hf-id>
#   #
#   # The "reasoning" profile activates Qwen3 thinking mode, which produces
#   # more exploratory, self-reflective responses at the cost of additional
#   # tokens. Recommended for reflective/exploratory sessions; switch at
#   # runtime with: /model reasoning
#   #
#   model_profile: "default"
#   models:
#     default:
#       model_path: "mlx-community/gemma-4-31b-it-8bit"
#       model_context_window: 131072
#       mlx_backend: auto          # auto | mlx-lm | mlx-vlm
#       enable_thinking: null       # null = omit (Gemma); true/false for Qwen3 templates
#     reasoning:
#       model_path: "mlx-community/Qwen3-30B-A3B-Instruct-2507-4bit"
#       model_context_window: 32768
#       temp: 0.6
#       top_p: 0.95
#       enable_thinking: true       # activates Qwen3 extended thinking template
#       max_tokens: 4096            # base budget (non-thinking fallback)
#       max_thinking_tokens: 8192   # extra <think> budget added on top of max_tokens
#       thinking_max_tokens: 16384  # optional explicit override when thinking is on
#
#   # Minimum generation budget when enable_thinking is true (thinking + answer
#   # share one cap). Profiles may override with thinking_max_tokens per profile.
#   # thinking_max_tokens: 16384
#
#   # Output-length management (model agnostic). Controls what Journaler does when
#   # a response is capped/truncated -- including mid-"thinking" cuts where the
#   # deliverable was never reached. The visible output can be made to run longer
#   # via multi-pass continuation, and you choose how recovery happens.
#   output_limit:
#     # Default behavior on a capped/truncated response:
#     #   prompt         -> ask: summarize / continue / stop (interactive chat)
#     #   auto_continue  -> automatically continue in additional passes
#     #   auto_summarize -> compress context, then retry
#     #   stop           -> keep the partial output and show a notice
#     policy: prompt
#     max_output_tokens: 8192        # per-pass budget (clamped to real headroom)
#     max_continuation_passes: 3     # cap on same-turn continuation passes
#     headroom_safety_tokens: 256    # margin subtracted from window - prompt
#     continue_mode: ask             # ask | same_turn | follow_up
#     summarize_scope_default: history   # history | history_and_partial
#     check_before_call: true        # act if projected headroom < min_output_tokens
#     min_output_tokens: 512         # headroom threshold that triggers recovery
#     truncation_heuristics: true    # detect open code fences / mid-line cuts
#     continuation_summary_tokens: 400   # budget for the compact continuation brief
#     continuation_overlap_chars: 300    # seam de-dup window for natural joins
#     force_answer_on_thinking_cut: true # thinking-phase cut -> jump to final answer
#     summarize_before_continue: true    # reclaim headroom before each continue pass
#
#   # The model's actual context window in tokens.
#   # Used by the context pressure manager to calculate utilization.
#   # Gemma 4 31B: 131072  |  Qwen3-30B-A3B: 32768  |  Qwen2.5-32B: 32768
#   model_context_window: 131072
#
#   # Scan interval for org-roam directory (minutes)
#   scan_interval_min: 10
#
#   # Morning briefing schedule
#   briefing_enabled: true
#   briefing_time: "09:00"       # local time (HH:MM); default 9:00
#
#   # Topics Discussion Briefing — multi-persona roundtable (disabled by default)
#   # discussion_briefing_enabled: false
#   # discussion_briefing_time: "08:45"     # runs before morning briefing; default 08:45
#   # personas_dir: "~/org-roam/engineering-hub/personas"  # default: personas/ at repo root
#   # discussion_persona_lookback_days: 7   # days of per-persona history to inject
#   # discussion_max_tokens_per_persona: 1024
#
#   # Coordination Analyst scheduled scan (disabled by default)
#   # coordination_scan_enabled: false
#   # coordination_scan_interval_min: 0    # 0 = disabled; e.g. 240 = every 4h
#
#   # Proactive topic scout: MLX one-shot when a scan tick detects journal changes
#   # proactive_topic_scout_enabled: true
#   # proactive_topic_scout_max_tokens: 512
#
#   # Background agent work loop: extracts tasks from briefings, delegates via
#   # AgentDelegator, tracks progress in a daily work status file, and feeds
#   # results into the end-of-day summary for tomorrow's briefing.
#   # background_work_enabled: false         # off by default; opt in to activate
#   # background_work_interval_min: 60       # how often the work loop checks the queue
#   # background_work_max_tasks_per_day: 6   # cap to avoid runaway model usage
#   # background_work_auto_approve: false     # when true, auto-delegates without confirmation
#   # background_work_agent_backend: "mlx"   # "mlx" | "claude" | "auto"
#   # background_work_chat_lookback_days: 3  # days of conversation.jsonl for priority signals
#
#   # Task-Integrator: inline call-and-response loop over the daily journal.
#   # Reads the whole day's note (minus the agent-managed sections below),
#   # interviews you inline under "* Agent Conversation", and after you reply
#   # inline, proposes ready-to-run @agent: tasks behind a checkbox. Ticking a
#   # box queues the task to "* Overnight Agent Tasks" for the Orchestrator —
#   # so you never have to remember the delegation syntax. Run a cycle on demand
#   # with /integrate (or /integrate status) in journaler chat.
#   # task_integrator_enabled: false           # off by default; opt in to activate
#   # task_integrator_interval_min: 15         # how often a cycle runs in the daemon
#   # task_integrator_conversation_section: "Agent Conversation"  # where Q&A/proposals are written
#   # task_integrator_output_section: "Overnight Agent Tasks"     # where approved tasks are queued
#   # task_integrator_excluded_sections:       # daily-note headings treated as agent-managed (not intake)
#   #   - "Agent Conversation"
#   #   - "Overnight Agent Tasks"
#   #   - "Completed Agent Tasks"
#   #   - "Pending Agent Tasks"
#   #   - "Timesheet"
#   #   - "Journaler Cross-References"
#   # task_integrator_max_questions: 3         # interview questions per topic
#   # task_integrator_weekdays_only: true      # only queue approved tasks Mon-Fri
#   # task_integrator_max_tokens: 1024         # model budget per interview/resolution call
#
#   # Daily conversation summary (end-of-day archive + /summarize command)
#   end_of_day_time: "15:30"     # local time (HH:MM); default 15:30
#                                # use 'journaler summarize' or /summarize to trigger on demand
#
#   # Scan scope: when false, only journal.org_journal_dir + watch_dirs are scanned
#   # for *.org (not the full roam tree). Large journal years: pair with lookback below.
#   # Incremental diff uses SHA-256 content hashes (state.json file_hashes); mtime-only
#   # bumps are ignored. "Significant changes" logs are journal + pending-tasks + outputs only.
#   # scan_org_roam_tree: true
#   # watch_dirs: []             # extra org directories to rglob, e.g. ["~/org-roam/projects"]
#   # journal_lookback_days: 30  # daily journal files within this many days (with cap)
#   # journal_max_files: 30      # max recent daily journal files to parse for context/tasks
#   # roam_task_lookback_days: 14   # roam project notes scanned for checkboxes/tasks
#   # roam_task_max_files: 30
#   # prose_completion_detection: true  # treat prose "finished X" as task completion
#
#   # HTTP chat endpoint
#   chat_enabled: true
#   chat_host: "127.0.0.1"
#   chat_port: 18790
#
#   # Slack webhook (outbound only — post briefings and alerts)
#   slack_enabled: false
#   slack_webhook_url: ""        # or set JOURNALER_SLACK_WEBHOOK env var
#
#   # Conversation settings
#   max_conversation_history: 40 # turns kept in memory
#   max_tokens: 4096
#   # Extra token budget for <think> reasoning blocks emitted by thinking models
#   # (Qwen3.x with enable_thinking). Thinking tokens do NOT count against
#   # max_tokens, so long reasoning can no longer truncate the final answer.
#   # Clamped to remaining context headroom at generation time. Set 0 to disable.
#   max_thinking_tokens: 8192
#
#   # Sampling parameters (defaults shown)
#   temp: 0.7
#   top_p: 0.9
#   min_p: 0.05
#   repetition_penalty: 1.1
#
#   # Slash /load accepts: .md .txt .org .py .yaml .yml .json .tex .csv .toml
#   # .rst .docx .pdf — DOCX and PDF are converted to markdown for context
#   # (Docling when the [docling] extra is installed, else pypdf/python-docx;
#   # scanned/image-only PDFs need the [docling-ocrmac] OCR extra).
#   #
#   # Slash /load: how much of the *remaining* context (after system, snapshot,
#   # history, reserved output, slack) may go to each file chunk. Uses the same
#   # len//3 token estimate as the pressure manager.
#   # load_max_context_fraction: 0.65   # (0, 1]; fraction of remaining tokens
#   # load_max_chars_absolute: 200000  # hard cap per file
#   # load_min_chars: 1024            # aim for at least this many chars when headroom allows
#   # load_slack_tokens: 128          # extra margin subtracted from headroom
#
#   # ── /load_recent: load most recently created workspace files ───
#   # Scans org-roam, outputs/, .journaler state, inputs, conversation
#   # exports, and zettelkasten proposals; ranks by creation time
#   # (birthtime, falling back to mtime) and auto-loads the top N.
#   # load_recent_max_files: 5        # default count when /load_recent has no N
#   # load_recent_days: 30            # only files created in the last N days (0 = no cutoff)
#   # load_recent_roots: []           # override scan roots, e.g. ["~/org-roam", "~/org-roam/engineering-hub/outputs"]
#
#   # ── Context management ─────────────────────────────────────────
#   # Controls how the daemon manages its finite context window over
#   # a full workday of conversation.  All values below are defaults.
#   context_management:
#     # Fraction of context window used before compression triggers (0.0–1.0)
#     compress_at: 0.85
#     # Fraction at which emergency trim fires if compression isn't enough
#     emergency_trim_at: 0.95
#     # Automatically archive old topic context when conversation topic shifts
#     auto_clear_on_topic_shift: false
#     # Prepend a bracketed note when the engine takes an automatic action
#     notify_user_on_action: true
#     # Time (HH:MM local) to run the end-of-day conversation clear
#     # Prefer top-level journaler.end_of_day_time; this nested key is a fallback override
#     end_of_day_time: "15:30"
#     # Auto-clear conversation after N minutes of inactivity
#     inactivity_clear_minutes: 120
#     # Write daily conversation summaries to memory.db (requires memory.enabled)
#     capture_daily_to_memory: false
#     # Tokens reserved for model output (held back from utilization calc)
#     reserved_for_generation: 4096
#     # Override model_context_window here if different from the top-level setting
#     # model_context_window: 32768
#     # Rolling window limits (also controlled by max_conversation_history above)
#     # max_history_turns: 40
#     # max_history_tokens: 20000
#     # compression_keep_recent: 8
#     # compression_summary_tokens: 800
#     # conversation_relation_threshold: 0.55
#     # conversation_relation_k: 5
#     # conversation_relation_excerpt_chars: 1000
#     # org_link_excerpt_chars: 400
#     # past_session_search_k: 5
#     # past_session_excerpt_chars: 1200
#   conversation_summary_excerpt_chars: 800
#
#   # ── Agent delegation ──────────────────────────────────────────
#   # The Journaler can delegate tasks inline to named agent personalities
#   # (research, technical-writer, standards-checker, technical-reviewer)
#   # using the /agent slash command in chat.
#
#   # Backend used when the Journaler delegates to an agent personality.
#   #   "mlx"    — always local model (default; reuses Journaler's loaded model, no extra RAM)
#   #   "claude" — always use Claude API (requires anthropic.api_key to be set)
#   #   "auto"   — Claude API if anthropic.api_key is present, else local MLX
#   # Can be overridden per-command with --backend mlx|claude in the /agent command.
#   agent_backend: "mlx"
#
#   # Path to skills YAML directory. Each .yaml file defines one agent delegation skill.
#   # Drop a new .yaml here to add a delegation capability without code changes.
#   # Default: skills/ directory at the repo root (alongside prompts/).
#   # skills_dir: "~/org-roam/engineering-hub/skills"
#
#   # Anthropic API key for Claude-backed delegation.
#   # Prefer ENGINEERING_HUB_ANTHROPIC_API_KEY or ENGINEERING_HUB_JOURNALER_ANTHROPIC_API_KEY in the environment
#   # (or top-level anthropic.api_key in YAML); use journaler.anthropic_api_key in YAML only if the file stays private.
#   # If omitted, delegation always uses the local MLX model.
#   # anthropic_api_key: ""

# ── Capture templates ──────────────────────────────────────────
# Hub capture templates define reusable org-roam node structures
# (contracting hours, project notes, etc.) with prompted fields
# and optional agent dispatch. See capture_templates/*.yaml.
#
# capture:
#   # Directory of capture template YAML files
#   templates_dir: "~/org-roam/engineering-hub/capture_templates"
#   # Emacs config.el for import/export of capture templates
#   emacs_config: "~/.doom.d/config.el"

# ── Per-agent model routing ───────────────────────────────────────
# Assign different local models to reasoning vs tool-use agent classes.
# Leave empty to use the global llm_provider model for all agents.
#
# Reasoning agents: standards-checker, evaluator, ref-engineer, weekly-reviewer,
#                   panning-for-gold
# Tool-use agents:  research, technical-writer, technical-reviewer, latex-writer
#
# agents:
#   models:
#     reasoning: "qwen3:32b"           # ollama pull qwen3:32b
#     tool_use:  "qwen3.6:35b-a3b"    # ollama pull qwen3.6:35b-a3b
#   # Optional token budget overrides per class:
#   # reasoning_max_tokens: 8192
#   # tool_use_max_tokens: 4096
